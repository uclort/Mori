name: Build Mobile Release (iOS)

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Unsigned iOS IPA (native SwiftUI)
        run: |
          VERSION=$(grep -E '^\s*MARKETING_VERSION:' ios/project.yml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          bash ios/build-ipa.sh "Mori-v${VERSION}-iOS-Unsigned"

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mori-iOS-Unsigned-IPA
          path: dist/*.ipa

      - name: Upload Release Asset (iOS)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
